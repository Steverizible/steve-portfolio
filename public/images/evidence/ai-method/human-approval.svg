<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" role="img" aria-label="Illustrative human approval workflow"><rect width="2000" height="1200" fill="#121212"/><text x="80" y="100" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="700" fill="#f5f5f5">ILLUSTRATIVE · Human approval in the loop</text><g font-family="ui-sans-serif,system-ui,sans-serif"><rect x="120" y="280" width="320" height="200" rx="20" fill="#1a1a1a" stroke="#555" stroke-width="2"/><text x="160" y="380" font-size="24" font-weight="700" fill="#fff">AI prepares</text><rect x="560" y="280" width="320" height="200" rx="20" fill="#1a1a1a" stroke="#f3ba48" stroke-width="3"/><text x="600" y="380" font-size="24" font-weight="700" fill="#f3ba48">Human reviews</text><rect x="1000" y="280" width="320" height="200" rx="20" fill="#1a1a1a" stroke="#555" stroke-width="2"/><text x="1040" y="380" font-size="24" font-weight="700" fill="#fff">Approve action</text><rect x="1440" y="280" width="400" height="200" rx="20" fill="#1a1a1a" stroke="#555" stroke-width="2"/><text x="1500" y="360" font-size="24" font-weight="700" fill="#fff">Measure</text><text x="1500" y="410" font-size="24" font-weight="700" fill="#fff">&amp; learn</text><path d="M440 380 H560 M880 380 H1000 M1320 380 H1440" stroke="#666" stroke-width="4"/><rect x="120" y="620" width="1720" height="280" rx="24" fill="#1a1a1a" stroke="#f3ba48" stroke-width="3"/><text x="180" y="740" font-size="32" font-weight="700" fill="#f3ba48">AI may recommend. A person remains accountable.</text><text x="180" y="810" font-size="22" fill="#ccc">No autonomous send · No automatic publish · Approval before execution</text></g></svg>