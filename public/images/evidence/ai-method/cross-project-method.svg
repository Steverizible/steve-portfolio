<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" role="img" aria-label="Illustrative diagram of one method across FisheWear Totely and Campaign Intelligence"><rect width="2000" height="1200" fill="#121212"/><text x="80" y="100" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="700" fill="#f5f5f5">ILLUSTRATIVE · One method, three outcomes</text><g font-family="ui-sans-serif,system-ui,sans-serif"><rect x="80" y="200" width="560" height="320" rx="24" fill="#1a1a1a" stroke="#6b4ea8" stroke-width="3"/><text x="120" y="270" font-size="22" font-weight="700" fill="#b79cf0">FISHEWEAR</text><text x="120" y="330" font-size="28" font-weight="700" fill="#fff">Grow an existing business</text><text x="120" y="390" font-size="18" fill="#bbb">Evidence → Lifecycle → Measure</text><rect x="720" y="200" width="560" height="320" rx="24" fill="#1a1a1a" stroke="#f3ba48" stroke-width="3"/><text x="760" y="270" font-size="22" font-weight="700" fill="#f3ba48">TOTELY</text><text x="760" y="330" font-size="28" font-weight="700" fill="#fff">Build a product from zero</text><text x="760" y="390" font-size="18" fill="#bbb">Discover → Design → Ship</text><rect x="1360" y="200" width="560" height="320" rx="24" fill="#1a1a1a" stroke="#4ea87a" stroke-width="3"/><text x="1400" y="270" font-size="22" font-weight="700" fill="#7fd4a8">CAMPAIGN INTEL</text><text x="1400" y="330" font-size="28" font-weight="700" fill="#fff">Design an operating system</text><text x="1400" y="390" font-size="18" fill="#bbb">Plan → Create → Learn</text></g><path d="M360 560 C360 760, 1640 760, 1640 560" fill="none" stroke="#f3ba48" stroke-width="4" stroke-dasharray="12 14"/><text x="700" y="900" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#f3ba48">Shared loop: Discover → Decide → Design → Build → Learn</text><text x="80" y="1120" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#888">Not a screenshot · Conceptual operatin