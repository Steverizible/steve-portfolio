<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" role="img" aria-label="Totely case-study hero: physical numbered totes connected to digital retrieval">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="2000" height="1200" fill="url(#bg)"/>
  <rect x="0" y="860" width="2000" height="340" fill="#171717"/>
  <!-- Shelving lines -->
  <rect x="120" y="320" width="980" height="16" rx="4" fill="#2a2a2a"/>
  <rect x="120" y="620" width="980" height="16" rx="4" fill="#2a2a2a"/>
  <!-- Row of totes -->
  <g transform="translate(160 360)">
    <rect width="180" height="220" rx="12" fill="#222"/>
    <circle cx="90" cy="100" r="34" fill="#111" stroke="#f3ba48" stroke-width="4"/>
    <text x="90" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#f3ba48">04</text>
  </g>
  <g transform="translate(380 360)">
    <rect width="180" height="220" rx="12" fill="#252525"/>
    <circle cx="90" cy="100" r="34" fill="#111" stroke="#f3ba48" stroke-width="4"/>
    <text x="90" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#f3ba48">12</text>
  </g>
  <g transform="translate(600 360)">
    <rect width="180" height="220" rx="12" fill="#1f1f1f"/>
    <circle cx="90" cy="100" r="34" fill="#111" stroke="#f3ba48" stroke-width="4"/>
    <text x="90" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#f3ba48">18</text>
  </g>
  <g transform="translate(820 360)">
    <rect width="180" height="220" rx="12" fill="#232323"/>
    <circle cx="90" cy="100" r="34" fill="#111" stroke="#f3ba48" stroke-width="4"/>
    <text x="90" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#f3ba48">21</text>
  </g>
  <!-- Lower tote being photographed -->
  <g transform="translate(320 680)">
    <rect width="260" height="160" rx="14" fill="#202020" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="70" cy="80" r="36" fill="#111" stroke="#f3ba48" stroke-width="4"/>
    <text x="70" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#f3ba48">12</text>
    <rect x="130" y="48" width="100" height="10" rx="5" fill="#3a3a3a"/>
    <rect x="130" y="72" width="80" height="8" rx="4" fill="#333"/>
    <rect x="130" y="96" width="90" height="8" rx="4" fill="#333"/>
  </g>
  <!-- Phone capturing -->
  <g transform="translate(1280 220)">
    <rect width="420" height="760" rx="44" fill="#0d0d0d" stroke="#444" stroke-width="5"/>
    <rect x="28" y="60" width="364" height="640" rx="24" fill="#171717"/>
    <text x="210" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f3ba48">TOTELY</text>
    <text x="210" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600" fill="#f5f5f5">Find anything stored</text>
    <rect x="60" y="220" width="300" height="70" rx="18" fill="#222" stroke="#3a3a3a" stroke-width="2"/>
    <text x="84" y="263" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#d0d0d0">Ask where something is&</text>
    <rect x="60" y="330" width="300" height="220" rx="22" fill="#1c1c1c" stroke="#f3ba48" stroke-width="3"/>
    <text x="90" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#fff">Tote 12</text>
    <text x="90" y="435" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#c8c8c8">Garage · Back Wall</text>
    <text x="90" y="475" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#c8c8c8">Upper Shelf</text>
    <circle cx="300" cy="390" r="28" fill="#f3ba48"/>
    <text x="300" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111">12</text>
  </g>
  <!-- Connection arc suggestion -->
  <path d="M640 760 C900 700, 1100 560, 1280 480" fill="none" stroke="#f3ba48" stroke-width="3" stroke-dasharray="10 12" opacity="0.7"/>
  <circle cx="640" cy="760" r="8" fill="#f3ba48"/>
  <circle cx="1280" cy="480" r="8" fill="#f3ba48"/>
</svg>
