<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Totely concept: numbered storage containers with a simplified search phone">
  <rect width="1600" height="1000" fill="#141414"/>
  <rect x="0" y="720" width="1600" height="280" fill="#1c1c1c"/>
  <rect x="80" y="0" width="8" height="1000" fill="#2a2a2a"/>
  <rect x="280" y="0" width="4" height="1000" fill="#242424"/>
  <rect x="520" y="0" width="4" height="1000" fill="#242424"/>
  <!-- Totes -->
  <g transform="translate(180 360)">
    <rect width="220" height="280" rx="10" fill="#222"/>
    <rect x="12" y="12" width="196" height="40" rx="6" fill="#f3ba48"/>
    <circle cx="110" cy="140" r="42" fill="#111" stroke="#f3ba48" stroke-width="4"/>
    <text x="110" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#f3ba48">12</text>
    <rect x="28" y="210" width="164" height="10" rx="5" fill="#333"/>
    <rect x="48" y="232" width="124" height="8" rx="4" fill="#2c2c2c"/>
  </g>
  <g transform="translate(460 420)">
    <rect width="200" height="240" rx="10" fill="#1f1f1f"/>
    <rect x="12" y="12" width="176" height="34" rx="6" fill="#f3ba48"/>
    <circle cx="100" cy="120" r="36" fill="#111" stroke="#f3ba48" stroke-width="3"/>
    <text x="100" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#f3ba48">07</text>
  </g>
  <g transform="translate(720 390)">
    <rect width="210" height="260" rx="10" fill="#242424"/>
    <rect x="12" y="12" width="186" height="36" rx="6" fill="#f3ba48"/>
    <circle cx="105" cy="130" r="38" fill="#111" stroke="#f3ba48" stroke-width="3"/>
    <text x="105" y="143" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#f3ba48">03</text>
  </g>
  <!-- Phone -->
  <g transform="translate(1080 220)">
    <rect width="300" height="560" rx="36" fill="#0d0d0d" stroke="#3a3a3a" stroke-width="4"/>
    <rect x="22" y="48" width="256" height="470" rx="18" fill="#181818"/>
    <rect x="110" y="20" width="80" height="10" rx="5" fill="#2a2a2a"/>
    <text x="150" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#f3ba48">TOTELY</text>
    <rect x="48" y="130" width="204" height="56" rx="14" fill="#222" stroke="#3a3a3a" stroke-width="2"/>
    <text x="68" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#cfcfcf">Where are the lights?</text>
    <rect x="48" y="210" width="204" height="150" rx="16" fill="#1b1b1b" stroke="#f3ba48" stroke-width="2"/>
    <text x="68" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Tote 12</text>
    <text x="68" y="280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#bdbdbd">Garage · Back Wall</text>
    <text x="68" y="310" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#bdbdbd">Upper Shelf</text>
    <circle cx="210" cy="250" r="22" fill="#f3ba48"/>
    <text x="210" y="257" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#111">12</text>
  </g>
  <text x="80" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f5f5f5">Stop searching.</text>
  <text x="80" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f3ba48">Start finding.</text>
</svg>
