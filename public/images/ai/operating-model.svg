<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" role="img" aria-label="Nine-stage operating model arranged as a loop">
  <rect width="2000" height="1200" fill="#111"/>
  <text x="80" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#f5f5f5">Operating model</text>
  <text x="80" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#b0b0b0">A loop from problem discovery to documented improvement</text>

  <!-- 3x3 grid of stages -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(80 220)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#444" stroke-width="2"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">01</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Discover the Problem</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Start with a meaningful need</text></g>
    <g transform="translate(710 220)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#444" stroke-width="2"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">02</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Gather Evidence</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Context before decisions</text></g>
    <g transform="translate(1340 220)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#444" stroke-width="2"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">03</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Define Strategy</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Choose direction and tradeoffs</text></g>

    <g transform="translate(80 490)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#444" stroke-width="2"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">04</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Design Workflow</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Product, campaign, or system</text></g>
    <g transform="translate(710 490)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#f3ba48" stroke-width="3"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">05</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Build With Judgment</text><text x="36" y="155" font-size="18" fill="#bdbdbd">AI accelerates · humans decide</text></g>
    <g transform="translate(1340 490)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#444" stroke-width="2"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">06</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Connect Tools</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Structured handoffs</text></g>

    <g transform="translate(80 760)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#444" stroke-width="2"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">07</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Review &amp; Govern</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Approval before execution</text></g>
    <g transform="translate(710 760)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#444" stroke-width="2"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">08</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Measure Outcomes</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Separate signal from noise</text></g>
    <g transform="translate(1340 760)"><rect width="580" height="220" rx="22" fill="#1a1a1a" stroke="#f3ba48" stroke-width="3"/><text x="36" y="60" font-size="18" font-weight="700" fill="#f3ba48">09</text><text x="36" y="110" font-size="26" font-weight="700" fill="#f5f5f5">Document &amp; Improve</text><text x="36" y="155" font-size="18" fill="#bdbdbd">Remember what was learned</text></g>
  </g>
</svg>
